<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Koseli – Menu</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;900&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    /* ---------- Colours (change them here) ---------- */
    :root {
      color-scheme: light;
      --bg: #fbf6ea;
      --paper: #fffdf7;
      --ink: #2b1a1f;
      --muted: #7b6a6e;
      --wine: #7a1f3d;
      --wine-light: #a43257;
      --gold: #b8893a;
      --line: #e6d9bd;

      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
      /* keeps section titles from hiding under the sticky bars */
      scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 110px);
    }

    body {
      margin: 0;
      background: var(--bg);
      background-image: radial-gradient(#e9dcc0 1px, transparent 1px);
      background-size: 22px 22px;
      color: var(--ink);
      font-family: Poppins, system-ui, sans-serif;
      line-height: 1.5;
    }

    /* ---------- Phone bar (top) ---------- */
    .top-bar {
      position: sticky;
      top: env(safe-area-inset-top, 0px);
      z-index: 10;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      padding: 9px 16px;
      background: var(--wine);
      color: #f6e7c1;
      font-size: 14px;
      letter-spacing: 0.5px;
    }

    .top-bar a {
      padding: 3px 16px;
      border-radius: 999px;
      background: #f6e7c1;
      color: var(--wine);
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      transition: transform 0.2s, box-shadow 0.2s;
      animation: ring 3s ease-in-out infinite;
    }

    .top-bar a:hover {
      transform: scale(1.07);
      box-shadow: 0 0 0 4px rgba(246, 231, 193, 0.35);
    }

    /* small shake every few seconds, like a ringing phone */
    @keyframes ring {
      0%, 88%, 100% { transform: rotate(0); }
      91% { transform: rotate(-4deg); }
      94% { transform: rotate(4deg); }
      97% { transform: rotate(-2deg); }
    }

    /* ---------- Header ---------- */
    .site-header {
      padding: 38px 20px 16px;
      text-align: center;
      animation: drop-in 0.9s ease both;
    }

    .kicker {
      color: var(--gold);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 6px;
      text-transform: uppercase;
    }

    h1 {
      margin: 6px 0 0;
      font-family: "Playfair Display", Georgia, serif;
      font-size: clamp(46px, 12vw, 86px);
      font-weight: 900;
      line-height: 1;
      letter-spacing: 2px;
      /* gold shine that slides across the name */
      background: linear-gradient(100deg, var(--wine) 30%, var(--gold) 50%, var(--wine) 70%);
      background-size: 250% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: shine 6s linear infinite;
    }

    .divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      max-width: 320px;
      margin: 10px auto 0;
      color: var(--gold);
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold));
    }

    .divider::after { transform: scaleX(-1); }

    .tagline {
      margin: 8px 0 0;
      color: var(--muted);
      font-family: "Playfair Display", serif;
      font-size: 14px;
      font-style: italic;
    }

    @keyframes shine { to { background-position: -250% 0; } }
    @keyframes drop-in { from { opacity: 0; transform: translateY(-18px); } }

    /* ---------- Category links ---------- */
    .category-nav {
      position: sticky;
      top: calc(env(safe-area-inset-top, 0px) + 44px);
      z-index: 9;
      padding: 10px 16px;
      background: var(--bg);
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      overflow-x: auto;
      white-space: nowrap;
      text-align: center;
      scrollbar-width: none;
    }

    .category-nav a {
      position: relative;
      display: inline-block;
      margin: 0 4px;
      padding: 5px 14px;
      color: var(--ink);
      font-size: 13px;
      font-weight: 500;
      text-decoration: none;
      transition: color 0.2s;
    }

    /* underline that draws itself on hover */
    .category-nav a::after {
      content: "";
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: 1px;
      height: 2px;
      background: var(--wine);
      transform: scaleX(0);
      transition: transform 0.3s;
    }

    .category-nav a:hover,
    .category-nav a:focus-visible {
      color: var(--wine);
      outline: none;
    }

    .category-nav a:hover::after,
    .category-nav a:focus-visible::after {
      transform: scaleX(1);
    }

    /* ---------- Menu sheet ---------- */
    .sheet {
      width: calc(100% - 24px);
      max-width: 1000px;
      margin: 24px auto;
      padding: 6px;
      background: var(--paper);
      border: 1px solid var(--gold);
      box-shadow: 0 10px 40px rgba(122, 31, 61, 0.12);
    }

    .menu {
      display: grid;
      grid-template-columns: 1fr;
      gap: 6px 44px;
      padding: 12px 20px 26px;
      border: 3px double var(--gold);
    }

    @media (min-width: 760px) {
      .menu { grid-template-columns: 1fr 1fr; }
    }

    .menu section {
      padding-top: 22px;
    }

    /* Fade-in is added by the script only AFTER the menu was built successfully,
       so a script problem can never leave the menu invisible. */
    .menu section.reveal {
      opacity: 0;
      transform: translateY(24px);
      transition: opacity 0.7s ease, transform 0.7s ease;
    }

    .menu section.reveal.visible {
      opacity: 1;
      transform: none;
    }

    /* shown if the menu cannot be built */
    .menu-error {
      grid-column: 1 / -1;
      margin: 20px 0;
      padding: 14px 16px;
      border: 1px solid var(--wine);
      border-radius: 8px;
      background: #f7e9ec;
      color: var(--wine);
      font-size: 14px;
    }

    h2 {
      margin: 0 0 4px;
      color: var(--wine);
      font-family: "Playfair Display", Georgia, serif;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 1px;
      text-align: center;
    }

    h2::after {
      content: "❖";
      display: block;
      margin-top: 2px;
      color: var(--gold);
      font-size: 12px;
    }

    .note {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 13px;
      font-style: italic;
      text-align: center;
    }

    ul {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    /* each row: name ........ price (the dots are the ::after) */
    li {
      display: flex;
      align-items: baseline;
      gap: 8px;
      padding: 7px 8px;
      border-radius: 8px;
      font-size: 15px;
      cursor: default;
      transition: background 0.25s, transform 0.25s, padding 0.25s;
    }

    li::after {
      content: "";
      order: 1;
      flex: 1;
      border-bottom: 2px dotted var(--line);
      transform: translateY(-4px);
    }

    li .name { order: 0; transition: color 0.25s; }
    li .price { order: 2; color: var(--wine); font-weight: 600; white-space: nowrap; }

    li:hover {
      padding-left: 14px;
      background: linear-gradient(90deg, #f7e9ec, transparent);
      transform: translateX(6px);
    }

    li:hover .name { color: var(--wine); }
    li:hover::after { border-color: var(--wine-light); }

    li:hover .name::before {
      content: "➤ ";
      color: var(--gold);
      font-size: 11px;
    }

    /* ---------- Footer ---------- */
    .site-footer {
      padding: 10px 16px calc(34px + env(safe-area-inset-bottom, 0px));
      color: var(--muted);
      font-family: "Playfair Display", serif;
      font-size: 14px;
      font-style: italic;
      text-align: center;
    }

    .site-footer a {
      color: var(--wine);
      font-family: Poppins, sans-serif;
      font-style: normal;
      font-weight: 700;
      text-decoration: none;
    }

    /* people who turned animations off get a calm page */
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
      .menu section.reveal { opacity: 1; transform: none; }
    }
  </style>
</head>

    const LOG = "[koseli]";
    console.log(LOG, "script started");

    // Small helper: creates an element, optionally with a class and text.
    // textContent is used everywhere, so no HTML escaping is needed.
    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    // Checks the data and logs exactly what is wrong instead of crashing.
    function validateMenu(menu) {
      const clean = [];
      if (!Array.isArray(menu)) {
        console.error(LOG, "MENU is not an array:", menu);
        return clean;
      }
      menu.forEach((category, i) => {
        if (!category || typeof category.id !== "string" || typeof category.title !== "string" || !Array.isArray(category.items)) {
          console.warn(LOG, "skipping category #" + i + " (needs id, title and items):", category);
          return;
        }
        const items = category.items.filter((item, j) => {
          const ok = Array.isArray(item) && typeof item[0] === "string" && item[0] !== "";
          if (!ok) console.warn(LOG, 'skipping item #' + j + ' in "' + category.title + '":', item);
          return ok;
        });
        clean.push({ id: category.id, title: category.title, note: category.note, items });
      });
      return clean;
    }

    function buildNav(menu, nav) {
      menu.forEach((category) => {
        const link = el("a", "", category.title);
        link.href = "#" + category.id;
        nav.appendChild(link);
      });
    }

    function buildMenu(menu, container) {
      menu.forEach((category) => {
        const section = el("section");
        section.id = category.id;
        section.appendChild(el("h2", "", category.title));

        if (category.note) section.appendChild(el("p", "note", category.note));

        const list = el("ul");
        category.items.forEach((item) => {
          const row = el("li");
          row.appendChild(el("span", "name", item[0]));
          // price is optional and may be a number or text
          if (item[1] !== undefined && item[1] !== null && String(item[1]).trim() !== "") {
            row.appendChild(el("span", "price", CURRENCY + " " + String(item[1])));
          }
          list.appendChild(row);
        });
        section.appendChild(list);
        container.appendChild(section);
      });
    }

    // Fade each section in when it scrolls into view.
    // If anything about this fails, the sections simply stay visible.
    function addRevealEffect(container) {
      const sections = container.querySelectorAll("section");
      if (!("IntersectionObserver" in window)) return;

      sections.forEach((section) => section.classList.add("reveal"));

      const observer = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            entry.target.classList.add("visible");
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: 0.08 });
      sections.forEach((section) => observer.observe(section));

      // safety net: never keep anything hidden for more than 3 seconds
      setTimeout(() => sections.forEach((s) => s.classList.add("visible")), 3000);
    }

    function init() {
      console.log(LOG, "DOM ready, building menu");
      const nav = document.getElementById("category-nav");
      const container = document.getElementById("menu");

      if (!nav || !container) {
        console.error(LOG, "missing element:", { nav: nav, menu: container });
        return;
      }

      try {
        const menu = validateMenu(MENU);
        console.log(LOG, menu.length + " categories, " + menu.reduce((n, c) => n + c.items.length, 0) + " items");
        buildNav(menu, nav);
        buildMenu(menu, container);
        console.log(LOG, "rendered " + container.querySelectorAll("section").length + " sections");
        addRevealEffect(container);
      } catch (error) {
        console.error(LOG, "render failed:", error);
        container.appendChild(el("p", "menu-error", "Sorry, the menu could not load (" + error.message + "). Please call +977 9702692122."));
      }
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", init);
    } else {
      init();
    }

    // Catches any other error on the page and prints it clearly
    window.addEventListener("error", (e) => console.error(LOG, "uncaught:", e.message, "at line", e.lineno));
